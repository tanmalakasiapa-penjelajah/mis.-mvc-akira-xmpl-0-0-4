<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lemari Akira — mvc-akira-xmpl-0-0-4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="toast-container" class="toast-container"></div>

<!-- LOGIN -->
<div id="login-page" class="login-page hidden">
  <div class="login-card">
    <div class="login-title">Lemari Akira</div>
    <div class="login-subtitle">mvc-akira-xmpl-0-0-4 · CQRS + JWT</div>
    <div id="login-error" class="login-error"></div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input id="login-email" type="email" class="form-input" placeholder="nama@domain.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input id="login-password" type="password" class="form-input" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button id="login-btn" class="btn btn-primary" style="width:100%">Masuk</button>
  </div>
</div>

<!-- SHELL -->
<div id="shell" class="hidden">
  <nav class="navbar">
    <div class="navbar-left">
      <span class="navbar-icon">&#9636;</span>
      <h1 class="navbar-title">Lemari Akira</h1>
      <span class="navbar-version">0.0.4 · CQRS+JWT</span>
    </div>
    <div class="navbar-right" id="nav-right"></div>
  </nav>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content" id="content-area"></main>
  </div>
</div>

<!-- MODAL -->
<div id="modal-overlay" class="modal-overlay">
  <div class="modal-container">
    <div class="modal-header">
      <h2 id="modal-title" class="modal-title"></h2>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
